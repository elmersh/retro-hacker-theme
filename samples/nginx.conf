# nginx
server {
    listen 443 ssl http2;
    server_name facxi.com www.facxi.com;
    root /var/www/facxi/public;

    ssl_certificate     /etc/letsencrypt/live/facxi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/facxi.com/privkey.pem;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        include fastcgi_params;
    }
}
